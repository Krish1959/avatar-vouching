# Version :071126 00:25
services:
  - type: web
    name: avag-vouching
    runtime: node
    # Recommended for in-memory link processing at the 200 MB limit: standard (1 CPU, 2 GB).
    # If you change the plan, set COMPUTE_RAM_MB below to match (512 / 2048 / 4096).
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ADMIN_EMAIL
        value: agentic.avai@gmail.com
      - key: SUPPORT_EMAIL
        value: admin@avag.ai
      - key: ROOT_FOLDER_NAME
        value: Vouching
      # ---- AI review stage ----
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4
      - key: OPENAI_REASONING_EFFORT
        value: high
      - key: GEMINI_MODEL
        value: gemini-3.1-pro-preview
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: MAX_AI_TEXT_CHARS
        value: "400000"
      - key: MAX_AI_ATTACH_MB
        value: "12"
      - key: SHARE_RESULTS_WITH_REQUESTER
        value: "true"
      # ---- Shared-link limits (shown on the web page) ----
      - key: MAX_LINKS
        value: "5"
      - key: MAX_LINK_DEPTH
        value: "3"
      - key: MAX_LINK_FILES
        value: "300"
      - key: MAX_LINK_TOTAL_MB
        value: "200"
      - key: MAX_AI_FILE_MB
        value: "60"
      # ---- Compute guard: must match the plan's RAM ----
      - key: COMPUTE_RAM_MB
        value: "512"
