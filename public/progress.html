<!doctype html>
<!-- Version :031126 01:10 -->
<!-- File    :public/progress.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vouching Live Progress</title>
<style>
  :root {
    --brown: #3d2314; --brown-2: #2a1810; --gold: #FFD700; --gold-soft: #e8c65a;
    --paper: #f0e8d8; --card: #fffaf0; --ink: #3a2010; --muted: #7a5a45;
    --ok: #1b7a3a; --bad: #a3271b; --line: #e3d2b0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", Arial, sans-serif; }
  header { background: var(--brown); color: var(--gold); padding: 18px 16px; text-align: center; }
  header .t1 { font-size: 1.25rem; font-weight: 700; }
  header .t2 { font-size: .72rem; letter-spacing: 3px; opacity: .85; margin-top: 4px; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }

  .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .meta > div { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .meta .k { font-size: .72rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .meta .v { font-size: 1.05rem; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
  #phase { text-align: center; margin: 4px 0 16px; font-weight: 600; color: var(--muted); min-height: 1.4em; }

  .stage { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .lane { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px 16px; text-align: center; position: relative; overflow: hidden; }
  .lane::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--brown); }
  .lane svg { width: 100%; max-width: 220px; height: auto; display: block; margin: 6px auto 0; }
  .name { font-size: 1.2rem; font-weight: 800; color: var(--brown); margin-top: 4px; }
  .model { font-size: .72rem; color: var(--muted); font-family: ui-monospace, Consolas, monospace; margin-top: 2px; min-height: 1em; }
  .clock { font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 1.35rem; font-weight: 700; margin-top: 10px;
           font-variant-numeric: tabular-nums; letter-spacing: .5px; color: var(--ink); }
  .chip { display: inline-block; margin-top: 8px; padding: 3px 12px; border-radius: 999px; font-size: .78rem; font-weight: 700;
          background: #efe3c8; color: var(--muted); }
  .chip.run { background: var(--brown); color: var(--gold); }
  .chip.ok { background: #dff0e3; color: var(--ok); }
  .chip.bad { background: #f6dcd8; color: var(--bad); }
  .note { font-size: .72rem; color: var(--bad); margin-top: 6px; min-height: 1em; padding: 0 6px; word-break: break-word; }

  .total { margin-top: 18px; background: var(--brown); color: var(--gold); border-radius: 14px; padding: 16px; text-align: center; }
  .total .k { font-size: .75rem; letter-spacing: 3px; text-transform: uppercase; opacity: .85; }
  .total .v { font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 2rem; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }

  .ask { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 16px; text-align: center; display: none; }
  .ask input { padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 1rem; width: 180px; text-transform: uppercase; }
  .ask button { padding: 9px 18px; background: var(--brown); color: var(--gold); border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; }
  footer { text-align: center; font-size: .72rem; color: var(--muted); margin-top: 22px; }

  @media (max-width: 620px) {
    .stage { gap: 8px; }
    .lane { padding: 10px 4px 12px; }
    .name { font-size: .95rem; }
    .clock { font-size: .86rem; }
    .model { font-size: .6rem; }
    .chip { font-size: .66rem; padding: 2px 8px; }
    .total .v { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<header>
  <div class="t1">Avatar Agentic AI, Singapore</div>
  <div class="t2">AVATAR VOUCHING AGENTIC AI · LIVE PROGRESS</div>
</header>
<main>
  <div class="meta">
    <div><div class="k">Reference</div><div class="v" id="ref">—</div></div>
    <div><div class="k">Start time (SGT)</div><div class="v" id="start">—</div></div>
  </div>
  <div id="phase">Connecting…</div>

  <div class="stage" id="stage"></div>

  <div class="total">
    <div class="k">Time taken</div>
    <div class="v" id="total">00:00:00:000</div>
  </div>

  <div class="ask" id="ask">
    <p id="askMsg">Enter your vouching reference to watch its progress.</p>
    <input id="refInput" placeholder="AV-XXXXXX" maxlength="12">
    <button id="go">Show</button>
  </div>

  <footer>© Avatar Agentic AI Pte Ltd · AVAG.AI · Times shown are from the start of the AI review.</footer>
</main>

<script>
(() => {
  const LANES = [
    { key: 'ChatGPT', name: 'OpenAI', period: 1.55 },
    { key: 'Gemini',  name: 'Gemini', period: 1.30 },
    { key: 'Claude',  name: 'Claude', period: 1.80 },
  ];
  const AMP = 32;            // swing amplitude, degrees
  const FINAL = ['completed', 'needs_attention', 'unavailable', 'failed'];
  const PHASE_TEXT = {
    queued: 'Queued — waiting for the previous job to finish',
    preparing: 'Preparing — reading the files and building the prompt',
    health_check: 'Health check — saying "Hi" to all three models',
    running: 'AI review in progress',
    finishing: 'All three models done — writing the Google Docs and emails',
    completed: 'Completed — results have been emailed',
    needs_attention: 'Finished — needs attention (our team has been alerted)',
    unavailable: 'System unavailable — our team has been alerted',
    failed: 'Stopped with an error — our team has been alerted',
  };

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  let ref = (params.get('ref') || '').trim().toUpperCase();
  let state = null;          // last JSON from the server
  let offset = 0;            // serverNow - local now
  let pollTimer = null;

  // ---- build the three lanes
  const stage = $('stage');
  for (const L of LANES) {
    const lane = document.createElement('div');
    lane.className = 'lane';
    lane.innerHTML = `
      <svg viewBox="0 0 200 210" aria-hidden="true">
        <rect x="30" y="8" width="140" height="8" rx="4" fill="#3d2314"/>
        <circle cx="100" cy="16" r="5" fill="#FFD700" stroke="#3d2314" stroke-width="2"/>
        <g class="arm" transform="rotate(0 100 16)">
          <line x1="100" y1="16" x2="100" y2="160" stroke="#3d2314" stroke-width="3" stroke-linecap="round"/>
          <circle class="bob" cx="100" cy="172" r="22" fill="#FFD700" stroke="#3d2314" stroke-width="4"/>
          <circle cx="93" cy="165" r="6" fill="#fff6c8" opacity=".7"/>
        </g>
      </svg>
      <div class="name">${L.name}</div>
      <div class="model"></div>
      <div class="clock">00:00:00:000</div>
      <div><span class="chip">Waiting</span></div>
      <div class="note"></div>`;
    stage.appendChild(lane);
    L.el = { lane, arm: lane.querySelector('.arm'), bob: lane.querySelector('.bob'), model: lane.querySelector('.model'),
             clock: lane.querySelector('.clock'), chip: lane.querySelector('.chip'), note: lane.querySelector('.note') };
    L.amp = 0;               // current amplitude (eases in / out)
  }

  // ---- helpers
  const pad = (n, w = 2) => String(Math.max(0, Math.floor(n))).padStart(w, '0');
  function fmt(ms) {
    if (ms == null || ms < 0) ms = 0;
    const h = ms / 3600000, m = (ms % 3600000) / 60000, s = (ms % 60000) / 1000;
    return `${pad(h)}:${pad(m)}:${pad(s)}:${pad(ms % 1000, 3)}`;
  }
  function sgt(ts) {
    return new Date(ts).toLocaleString('en-SG', { timeZone: 'Asia/Singapore', day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  }
  const now = () => Date.now() + offset;
  const modelOf = (key) => state?.models?.find((m) => m.key === key || m.label === key);

  // ---- data
  async function poll() {
    try {
      const url = ref ? `/api/progress/${encodeURIComponent(ref)}` : '/api/progress';
      const t0 = Date.now();
      const r = await fetch(url, { cache: 'no-store' });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        showAsk(j.error || 'No progress found.');
        return schedule(5000);
      }
      offset = j.serverNow - (t0 + Date.now()) / 2;
      state = j;
      if (!ref) { ref = j.reference; history.replaceState(null, '', `?ref=${encodeURIComponent(ref)}`); }
      $('ask').style.display = 'none';
      render();
      if (!FINAL.includes(j.phase)) schedule(1500);
    } catch {
      $('phase').textContent = 'Connection lost — retrying…';
      schedule(4000);
    }
  }
  function schedule(ms) { clearTimeout(pollTimer); pollTimer = setTimeout(poll, ms); }

  function showAsk(msg) {
    $('askMsg').textContent = msg;
    $('ask').style.display = 'block';
    $('phase').textContent = '';
    if (ref) $('refInput').value = ref;
  }
  $('go').onclick = () => {
    const v = $('refInput').value.trim().toUpperCase();
    if (!v) return;
    ref = v; state = null;
    history.replaceState(null, '', `?ref=${encodeURIComponent(ref)}`);
    poll();
  };
  $('refInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });

  // ---- static parts (on every poll)
  function render() {
    $('ref').textContent = state.reference;
    $('start').textContent = state.startedAt ? sgt(state.startedAt) : '—';
    let txt = PHASE_TEXT[state.phase] || state.phase;
    if (state.phase === 'queued' && state.queuePosition) txt += ` (position ${state.queuePosition})`;
    $('phase').textContent = txt;
    for (const L of LANES) {
      const m = modelOf(L.key) || {};
      L.el.model.textContent = m.model || '';
      const chip = L.el.chip;
      if (m.endedAt) {
        chip.textContent = m.ok ? 'Done ✓' : 'Incomplete ✗';
        chip.className = 'chip ' + (m.ok ? 'ok' : 'bad');
        L.el.bob.setAttribute('fill', m.ok ? '#7fd39a' : '#f19b8f');
        L.el.note.textContent = m.ok ? '' : (m.note || '');
      } else if (state.startedAt && !FINAL.includes(state.phase)) {
        chip.textContent = 'Working…'; chip.className = 'chip run';
        L.el.bob.setAttribute('fill', '#FFD700'); L.el.note.textContent = '';
      } else {
        chip.textContent = FINAL.includes(state.phase) ? 'Not run' : 'Waiting';
        chip.className = 'chip'; L.el.note.textContent = '';
      }
    }
  }

  // ---- animation (swing + clocks), 60 fps
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.1, (t - last) / 1000); last = t;
    const n = now();
    let latestEnd = 0, allEnded = !!state?.startedAt;
    for (const L of LANES) {
      const m = modelOf(L.key) || {};
      const running = !!(state?.startedAt && !m.endedAt && !FINAL.includes(state.phase));
      // amplitude eases toward its target so the pendulum glides to a stop
      const target = running ? AMP : 0;
      L.amp += (target - L.amp) * Math.min(1, dt * (running ? 1.6 : 0.9));
      if (Math.abs(L.amp) < 0.05) L.amp = 0;
      const angle = L.amp * Math.sin((2 * Math.PI * t) / 1000 / L.period);
      L.el.arm.setAttribute('transform', `rotate(${angle.toFixed(2)} 100 16)`);

      if (state?.startedAt) {
        const end = m.endedAt || (FINAL.includes(state.phase) ? (state.finishedAt || n) : n);
        L.el.clock.textContent = fmt(end - state.startedAt);
        if (m.endedAt) latestEnd = Math.max(latestEnd, m.endedAt); else allEnded = false;
      } else {
        L.el.clock.textContent = fmt(0);
      }
    }
    if (state?.startedAt) {
      const end = allEnded ? latestEnd : FINAL.includes(state.phase) ? (state.finishedAt || n) : n;
      $('total').textContent = fmt(end - state.startedAt);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  poll();
})();
</script>
</body>
</html>
